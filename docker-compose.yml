# =============================================================================
# AI Bot Live Quiz Arena — Full-Stack Docker Compose
# Usage:
#   cp .env.example .env   # then edit credentials, Supabase, and Sentry DSN
#   docker compose up --build -d
#   Frontend UI : http://localhost:3000
#   Backend API : http://localhost:8080/docs
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quiz-arena-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    networks:
      - arena-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quiz-arena-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - arena-net

networks:
  arena-net:
    driver: bridge
